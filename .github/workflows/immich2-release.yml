name: Build and publish Immich APK
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Fork branch, tag or commit to build
        default: shared-albums
        required: true
        type: string
  push:
    branches: [shared-albums]
    paths:
      - 'mobile/**'
      - 'open-api/**'
      - 'i18n/**'
      - 'patches/shared-albums/**'
      - '.github/workflows/immich2-release.yml'
permissions:
  contents: read
concurrency:
  group: shared-albums-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      tag: ${{ steps.meta.outputs.tag }}
      filename: ${{ steps.meta.outputs.filename }}
    steps:
      - name: Checkout patched fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: padrossov/immich-shared-timeline-map-android
          ref: ${{ inputs.source_ref || github.sha }}
          path: immich
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Require the existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.IMMICH2_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore" || {
            echo "Signing secret ANDROID_KEYSTORE_BASE64 is missing in this fork. Configure the existing keystore; no replacement key is generated." >&2
            exit 1
          }
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey |
            sha256sum | awk '{print $1}' | grep -Fx '154199b39a2bbdc1d3bba4996b430639b23035005f960d007accb469aa7afc79'
      - name: Resolve build metadata
        id: meta
        working-directory: immich
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          text = pathlib.Path('mobile/pubspec.yaml').read_text()
          match = re.search(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+[^\s]+)?\s*$', text, re.M)
          if not match:
              raise SystemExit('Cannot resolve application version from pubspec.yaml')
          version = match.group(1)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tag = f"v{version}-shared-albums.{os.environ['GITHUB_RUN_ID']}.{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\nsource_sha={sha}\ntag={tag}\nfilename=Immich-{version}-shared-albums-arm64-release.apk\n')
          PY
      - name: Free disk space on the disposable Android runner
        run: |
          df -h .
          # Only unused preinstalled tools/images on this ephemeral runner.
          # Java, Node, Flutter and Android platform/build tools are retained.
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/swift /opt/hostedtoolcache/CodeQL
          sudo rm -rf "${ANDROID_HOME:?}/system-images" "${ANDROID_HOME:?}/ndk"
          if command -v docker >/dev/null && sudo docker info >/dev/null 2>&1; then
            sudo docker image prune --all --force
          fi
          df -h .
          available_kb=$(df --output=avail -k . | tail -n 1)
          if [ "$available_kb" -lt 26214400 ]; then
            echo "Insufficient disk space for Android build: require at least 25 GiB before setup" >&2
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install OpenAPI generator
        run: npm install --global @openapitools/openapi-generator-cli@2.41.0
      - name: Generate SDK and application code
        run: bash immich/patches/shared-albums/build.sh immich prepare
      - name: Analyze and test
        run: bash immich/patches/shared-albums/build.sh immich check
      - name: Restore Android compiler cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: immich-3.3.5-gradle-${{ runner.os }}-v1
      - name: Prepare runner memory and diagnostics
        run: |
          free -h
          df -h .
          if [ "$(df --output=avail -k . | tail -n 1)" -gt 12582912 ]; then
            sudo fallocate -l 4G "$RUNNER_TEMP/immich-build.swap"
            sudo chmod 600 "$RUNNER_TEMP/immich-build.swap"
            sudo mkswap "$RUNNER_TEMP/immich-build.swap"
            sudo swapon "$RUNNER_TEMP/immich-build.swap"
          fi
          free -h
      - name: Build release APK
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          set -o pipefail
          bash immich/patches/shared-albums/build.sh immich apk 2>&1 | tee APK-build.log
      - name: Record APK checksum and development certificate
        env:
          APK_FILENAME: ${{ steps.meta.outputs.filename }}
        working-directory: immich/mobile/build/app/outputs/flutter-apk
        run: |
          mv app-release.apk "$APK_FILENAME"
          sha256sum "$APK_FILENAME" | tee SHA256SUMS
          sdk_build_tools=$(find "${ANDROID_HOME:?}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$sdk_build_tools/apksigner"
          set -o pipefail
          "$sdk_build_tools/apksigner" verify --verbose --print-certs "$APK_FILENAME" | tee signing-certificate.txt
      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: immich-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            immich/mobile/build/app/outputs/flutter-apk/${{ steps.meta.outputs.filename }}
            immich/mobile/build/app/outputs/flutter-apk/SHA256SUMS
            immich/mobile/build/app/outputs/flutter-apk/signing-certificate.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Android compiler cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: immich-3.3.5-gradle-${{ runner.os }}-v1
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: APK-build-diagnostics
          path: APK-build.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build output
        uses: actions/download-artifact@v4
        with:
          name: immich-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Verify downloaded APK and publish release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.android.outputs.version }}
          SOURCE_SHA: ${{ needs.android.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.android.outputs.tag }}
          APK_FILENAME: ${{ needs.android.outputs.filename }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json, os, pathlib
          metadata = {
              'version': os.environ['APP_VERSION'],
              'source_commit': os.environ['SOURCE_SHA'],
              'workflow_url': os.environ['BUILD_URL'],
              'filename': os.environ['APK_FILENAME'],
              'application_id': 'app.alextran.immich.sharedalbums',
              'display_name': 'Immich',
              'build_mode': 'release',
              'abi': 'arm64-v8a',
          }
          pathlib.Path('build-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          notes = (
              f"Immich {os.environ['APP_VERSION']} mit Albumfiltern für Zeitleiste und Karte.\n\n"
              "ARM64-Release-APK. Anzeigename: Immich. Paketkennung: app.alextran.immich.sharedalbums.\n"
              "Signierung mit dem bisherigen Zertifikat; bestehende Testinstallation kann aktualisiert werden.\n\n"
              f"Quellcode: {os.environ['SOURCE_SHA']}\nBuild und Tests: {os.environ['BUILD_URL']}\n"
              "APK-Prüfsumme und Signaturdaten stehen als eigene Downloads bereit.\n"
          )
          pathlib.Path('notes.md').write_text(notes)
          PY
          gh release create "$RELEASE_TAG" \
            "$APK_FILENAME" SHA256SUMS signing-certificate.txt build-metadata.json \
            --target "$SOURCE_SHA" \
            --title "Immich $APP_VERSION — Geteilte Alben" \
            --notes-file notes.md \
            --latest
