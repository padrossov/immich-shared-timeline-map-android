name: Publish verified Immich APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-verified-apk.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d75404f5f42452245f0ea7b289809e63202f9f2a
          persist-credentials: false
      - name: Download and verify the previously built APK
        env:
          ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3594-81f5-b369-a7e1a5185898/raw?se=2026-10-27T18%3A43%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=01d676fc-216d-465b-b44e-37b5ca65c1d3&skoid=697a5987-0cd9-4222-b5b8-500b90fa271b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T11%3A47%3A38Z&ske=2026-10-28T11%3A47%3A38Z&sks=b&skv=2026-02-06&sig=SjkyQk18YATd8ajr44D/kY8PT/2PjFRgtmd0WoBdwLA%3D'
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request, zipfile
          root = pathlib.Path('verified-release')
          root.mkdir()
          with urllib.request.urlopen(os.environ['ARTIFACT_URL'], timeout=120) as response:
              (root / 'artifact.zip').write_bytes(response.read())
          names = {'Immich-3.3.5-shared-albums-arm64-release.apk', 'SHA256SUMS', 'signing-certificate.txt'}
          with zipfile.ZipFile(root / 'artifact.zip') as archive:
              assert set(archive.namelist()) == names, archive.namelist()
              archive.extractall(root)
          apk = root / 'Immich-3.3.5-shared-albums-arm64-release.apk'
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == '2a51d271b3ecfe3c258bfb9554c939d26a544d494ded0c9688399bdef4de01b5'
          assert apk.stat().st_size == 100180261
          PY
          cp patches/shared-albums/release.json verified-release/build-metadata.json
          cat > verified-release/notes.md <<'NOTES'
          Immich 3.3.5 mit Albumfiltern für Zeitleiste und Karte, ARM64-Release-APK.
          
          Anzeigename: Immich. Separate Paketkennung: app.alextran.immich.sharedalbums.
          Die bisherige Testversion lässt sich mit derselben Signatur aktualisieren.
          
          Quelle: 642e50ecf5361afb08fbc3155dff58eaee9c993f.
          Build: https://github.com/padrossov/ImmichApk/actions/runs/40525890651
          Flutter-Analyse, 15 Flutter-Tests und 18 SQL-Prüfungen bestanden.
          Die heruntergeladene APK wurde erneut gegen SHA-256 geprüft.
          Diese Ausgabe veröffentlicht die bereits geprüfte APK; sie ist kein neuer Build.
          NOTES
      - name: Publish APK under Releases in this fork
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v3.3.5-shared-albums.1 \
            verified-release/Immich-3.3.5-shared-albums-arm64-release.apk \
            verified-release/SHA256SUMS \
            verified-release/signing-certificate.txt \
            verified-release/build-metadata.json \
            --target 642e50ecf5361afb08fbc3155dff58eaee9c993f \
            --title "Immich 3.3.5 — Geteilte Alben" \
            --notes-file verified-release/notes.md \
            --latest
